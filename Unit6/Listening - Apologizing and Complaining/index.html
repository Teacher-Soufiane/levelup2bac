<style>

.gap-slot.correct{border:2px solid var(--ok);background:var(--okbg)}.gap-slot.wrong{border:2px solid var(--bad);background:var(--badbg)}

.task-label{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 4px}

.transcript summary{cursor:pointer;font-weight:700;min-height:28px}
.transcript p{margin:8px 0}
.gap-text{text-align:left;font-size:16px;line-height:1.7}
.bs-chip{min-width:44px}

@media (max-width:640px){.info-bar{font-size:10px;flex-wrap:nowrap;align-items:center;padding:8px;text-align:center}}
.tray .chip,.col .chip,.gap-slot .chip{border-radius:12px}
.col .chip{width:100%;margin-bottom:6px;text-align:left}
.review-item div{white-space:pre-line}

.gap-text{margin:6px 0}

/* ---------- one delegated listener per stable container, bound once ---------- */

    case 'toggle': engine.toggle(id); break;

    case 'reset': engine.reset(); break;

    case 'prev': engine.prev(); break;

function bind(){

    var top=kids[0].offsetTop, bot=kids[kids.length-1].offsetTop+kids[kids.length-1].offsetHeight;
    var box=document.createElement('div'); box.className='listen-lock'; box.setAttribute('role','status');
    box.style.top=top+'px'; box.style.height=Math.max(60,bot-top)+'px';
    box.innerHTML='<span>🎧 Listen to the whole conversation first.<br>Then you can answer.<small></small></span>';
    app.appendChild(box); paintLeft();
  }
  var prev=window.__fitMove; window.__fitMove=function(){ if(prev) prev(); paint(); };
  window.addEventListener('resize',function(){ setTimeout(paint,120); });
  window.__listenGate={ get heard(){return heard;}, pct:pct };
  paint();
})();
</script>
<style id="u6fit-2026-11-18">
/* U6FIT-2026-11-18: two Unit 6 screens were still a little too tall on a phone after the Unit 10 rules */
@media (max-width:640px){
  #app .stats-row{padding:5px 8px!important;gap:2px 10px!important;margin-top:8px!important}
  /* sorting: while the expressions are still in the list, the empty columns are shorter */
  #tray ~ #cols{gap:6px!important}
  #tray ~ #cols .col{min-height:44px!important;padding:5px 6px!important}
  #tray ~ #cols .col h3{font-size:13.5px!important;line-height:1.25!important;margin-bottom:3px!important}
}
</style>
<style id="speakers-2026-11-18">
/* SPEAKERS-2026-11-18 (teacher): two portraits beside the player, the boy on the left and the girl on the right.
   The one who is speaking glows and shows sound bars; the other one is faded. During the intro nobody is highlighted. */
#audioMount #speakers{display:none!important}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;margin:0 0 8px}
.stage>.player{margin:0!important;min-width:0}
.spk{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;width:84px}
.spk img{display:block;width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #dbeafe;background:#eaf4ff;transition:transform .2s,box-shadow .2s,filter .25s,opacity .25s,border-color .2s}
.spk figcaption{font:700 13px/1.2 Poppins,Arial,sans-serif;color:#123d70;transition:color .2s}
.stage.talking .spk:not(.on) img{opacity:.5;filter:grayscale(.6)}
.stage.talking .spk:not(.on) figcaption{color:#94a3b8}
.spk.on img{border-color:#2563eb;transform:scale(1.07);animation:spkPulse 1.1s ease-out infinite}
.spk.on figcaption{color:#2563eb}
@keyframes spkPulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.55)}100%{box-shadow:0 0 0 13px rgba(37,99,235,0)}}
.spk .waves{position:absolute;top:24px;display:flex;align-items:center;gap:2px;height:26px;opacity:0;transition:opacity .2s}
.spk-left .waves{right:-10px}.spk-right .waves{left:-10px}
.spk .waves i{display:block;width:3px;height:30%;border-radius:2px;background:#2563eb}
.spk.on .waves{opacity:1}
.spk.on .waves i{animation:spkBar .55s ease-in-out infinite alternate}
.spk.on .waves i:nth-child(2){animation-delay:.18s}.spk.on .waves i:nth-child(3){animation-delay:.36s}
@keyframes spkBar{from{height:25%}to{height:100%}}
@media (max-width:640px){
  .stage{gap:6px;padding:0 4px}
  .spk{width:58px;gap:1px}
  .spk.on img{transform:scale(1.04)}
  /* compact player between the two portraits: ◀10 | Play | 10▶, then time + progress bar */
  #stage>.player{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;gap:5px 6px;align-items:center;padding:5px 6px!important}
  #stage>.player>#audBack{grid-column:1;grid-row:1}
  #stage>.player>#audPlay{grid-column:2;grid-row:1}
  #stage>.player>#audFwd{grid-column:3;grid-row:1}
  #stage>.player>#audTime{grid-column:1;grid-row:2;font-size:12px;line-height:1}
  #stage>.player>.track{grid-column:2/4;grid-row:2;width:auto}
  #stage>.player>#audMsg{grid-column:1/-1}
  #stage>.player>button{min-height:40px!important;height:40px;padding:0 8px!important;min-width:0!important;margin:0!important;font-size:14px!important}
  #stage>.player>#audPlay{padding:0 6px!important;white-space:nowrap}
  .spk img{width:50px;height:50px;border-width:2px}
  .spk figcaption{font-size:11.5px}
  .spk .waves{top:14px;height:22px}
  .spk-left .waves{right:-6px}.spk-right .waves{left:-6px}
}
@media (prefers-reduced-motion:reduce){.spk.on img,.spk.on .waves i{animation:none}}
</style>
<script>
(function(){
  var cfg=window.QUIZ_CONFIG||{}, a=document.getElementById('audio'), player=document.getElementById('player');
  var list=(cfg.speakers||[]).filter(function(s){ return s.img; }); if(!a||!player||list.length<2) return;
  var turns=cfg.turns||[];
  var stage=document.createElement('div'); stage.className='stage'; stage.id='stage';
  function fig(s){
    var f=document.createElement('figure'); f.className='spk spk-'+(s.side||'left'); f.dataset.who=String(cfg.speakers.indexOf(s));
    var im=document.createElement('img'); im.alt=s.name; im.src=s.img; im.onerror=function(){ f.style.visibility='hidden'; };
    var w=document.createElement('span'); w.className='waves'; w.setAttribute('aria-hidden','true'); w.innerHTML='<i></i><i></i><i></i>';
    var c=document.createElement('figcaption'); c.textContent=s.name;
    f.appendChild(im); f.appendChild(w); f.appendChild(c); return f;
  }
  var L=list.filter(function(s){ return s.side!=='right'; })[0]||list[0], R=list.filter(function(s){ return s.side==='right'; })[0]||list[1];
  player.parentNode.insertBefore(stage,player);
  stage.appendChild(fig(L)); stage.appendChild(player); stage.appendChild(fig(R));
  var figs=[].slice.call(stage.querySelectorAll('.spk')), now=-1;
  function who(t){ for(var i=0;i<turns.length;i++){ var x=turns[i]; if(t>=x[0]-0.15&&t<=x[1]+0.3) return x[2]; } return -1; }
  function paint(){
    var w=a.paused?-1:who(a.currentTime||0); if(w===now) return; now=w;
    stage.classList.toggle('talking',w>=0);
    figs.forEach(function(f){ f.classList.toggle('on',String(w)===f.dataset.who); });
  }
  var raf=0; function loop(){ paint(); raf=a.paused?0:requestAnimationFrame(loop); }
  ['play','playing','pause','ended','seeked','timeupdate'].forEach(function(e){ a.addEventListener(e,function(){ if(!a.paused&&!raf) raf=requestAnimationFrame(loop); paint(); }); });
  window.__speakers={ who:who, paint:paint };
})();
</script>
