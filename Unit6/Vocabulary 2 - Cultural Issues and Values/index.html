<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultural Issues and Values — Vocabulary Quiz 2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* Level UP 2BAC · Unit 2 Vocabulary Quiz 1 (teacher's Canva quiz, moved onto the Unit 10 vocabulary page 2026-11-16).
   Header and info bar: the common values (LU-COMMON). Everything below the bar: the Vocabulary reference
   (Unit 5 Vocabulary 2) values — gradient instruction card, pale definition box, white answer cards in two columns. */
:root{--navy:#073b77;--blue:#2563eb;--ink:#17253b;--muted:#64748b;--line:#d9e3ef;--ok:#26a85b;--okbg:#e0f6e8;--okink:#116b37;--bad:#e15a5a;--badbg:#ffe8e8;--badink:#a92c2c}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#edf4fa;color:var(--ink);font-family:Poppins,Arial,sans-serif}
button{font:inherit}
button:focus-visible{outline:3px solid #f9c74f;outline-offset:3px}
.sheet{max-width:1100px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eaf4ff;padding:10px 14px}
.hdr img{height:96px;width:auto;flex:none;display:block}
.htitle{flex:1 1 auto;min-width:0;text-align:center;line-height:1.2}
.t1{font-size:26px;font-weight:800;color:#1e3a5f}.t2{font-size:18px;color:#2563eb}.t3{font-size:14px;color:#64748b}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#123d70;color:#fff;font:600 13px/1.5 Poppins,Arial,sans-serif;padding:8px 14px;min-height:36px;text-transform:uppercase}
.bar span{white-space:nowrap}.bar span:nth-child(2){flex:1 1 auto;min-width:0;white-space:normal;text-align:center}
#app{max-width:760px;margin:34px auto 28px;padding:0 16px}
.instr{background:linear-gradient(135deg,#0c4f96,#147fc9);color:#fff;border-radius:20px;padding:22px 30px;box-shadow:0 10px 22px rgba(18,104,189,.2);font-size:23.2px;font-weight:800;line-height:1.5;letter-spacing:.812px;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:14px;border-radius:999px;background:#e6f2ff;color:var(--blue);padding:6px 12px;font-size:12.8px;font-weight:800}
.taskbox{margin:14px 0;background:#f5f9fd;border:1px solid #d7e7f4;border-radius:18px;padding:14px 18px;font-size:20px;font-weight:600;line-height:34px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.choice{position:relative;min-height:66px;border:2px solid #d5e1ec;border-radius:16px;background:#fff;padding:14px 17px;text-align:left;color:var(--ink);font-size:16px;font-weight:700;line-height:24px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);box-shadow:0 8px 18px rgba(18,104,189,.12)}
.choice:disabled{cursor:default}
.choice .lt{color:var(--blue);margin-right:6px}
.choice.correct{background:var(--okbg);border-color:var(--ok);color:var(--okink)}.choice.correct .lt{color:var(--okink)}
.choice.wrong{background:var(--badbg);border-color:var(--bad);color:var(--badink)}.choice.wrong .lt{color:var(--badink)}
.choice .mk{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:800}
.choice.correct,.choice.wrong{padding-right:38px}
.feedback{margin-top:14px;border-radius:15px;padding:12px 17px;background:#edf6ff;border-left:5px solid var(--blue);font-size:16px;line-height:25.6px}
.feedback.ok{background:#eaf8ef;border-left-color:var(--ok)}.feedback.bad{background:#fff1f1;border-left-color:var(--bad)}
.feedback b{color:var(--navy)}
/* word bank and drop gaps */
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px;padding:10px;border:2px dashed #b9d3ea;border-radius:16px;background:#fff;min-height:66px;align-items:center}
.bank .empty{color:var(--muted);font-size:14px;font-weight:600}
.chip{border:2px solid #d5e1ec;border-radius:12px;background:#fff;padding:8px 14px;min-height:44px;font-size:16px;font-weight:700;line-height:1.3;color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip:hover{border-color:var(--blue)}
.chip.dragging{opacity:.35}
.chip:disabled{cursor:default;border-color:#e2e8f0}.chip:disabled:hover{border-color:#e2e8f0}
.chip.used{background:#eef2f6;color:#94a3b8;text-decoration:line-through;border-style:dashed}
.taskbox.gapq{margin:12px 0 0}
.taskbox.gapq .num{margin-right:2px}
.gap .to{margin-left:6px;color:var(--okink);font-weight:800;white-space:nowrap}
.mrow .gap.wrong{flex-wrap:wrap;justify-content:center;padding:2px 6px}
.mrow{padding:3px 0}.mrow .gap{min-height:34px}
.board+.feedback{margin-top:10px;padding-top:9px;padding-bottom:9px}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 10px 24px rgba(7,59,119,.25);border-color:var(--blue)!important;background:#fff}
.board{margin:12px 0 0;background:#f5f9fd;border:1px solid #d7e7f4;border-radius:18px;padding:6px 16px;font-size:17px;font-weight:600;line-height:1.55}
.srow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #e3ebf2}.srow:last-child{border-bottom:0}
.num{flex:none;font-weight:800;color:var(--navy);min-width:20px}
.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:132px;min-height:36px;margin:1px 2px;padding:2px 10px;border:2px dashed #8fb5da;border-radius:10px;background:#fff;color:var(--navy);font-size:16px;font-weight:700;line-height:1.25;cursor:pointer}
.gap.filled{border-style:solid;border-color:#2389d7;background:#d9efff;color:#075796}
.gap.sel{box-shadow:0 0 0 3px #f9c74f}
.gap.over{background:#fff6d1;border-color:#e0a800}
.gap.correct{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--okink);cursor:default}
.gap.wrong{border-style:solid;border-color:var(--bad);background:var(--badbg);color:var(--badink);cursor:default}
.gap.wrong .w{text-decoration:line-through}
.fix{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:8px;background:var(--okbg);color:var(--okink);border:2px solid var(--ok);font-size:15px;font-weight:700;vertical-align:middle}
.why{display:block;margin-top:3px;font-size:13.5px;line-height:1.4;font-weight:500;color:#475569}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid #e3ebf2}.mrow:last-child{border-bottom:0}
.mdef{font-size:15px;line-height:1.4;font-weight:500;display:flex;gap:8px}.mdef .num{min-width:18px}
.mrow .gap{width:100%;min-width:0;margin:0}
.mcell{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.mcell .fix{margin:0;text-align:center}
/* navigation and stats */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;padding:8px 0}
.navbtn{display:inline-flex;align-items:center;justify-content:center;min-width:140px;min-height:44px;border:1px solid #1e3a5f;border-radius:12px;background:#1e3a5f;color:#fff;padding:10px 17px;font-weight:800;cursor:pointer;white-space:nowrap}
.navbtn:hover:not(:disabled){background:#16304f}
.navbtn:disabled{opacity:.42;cursor:not-allowed}
.navbtn.check{background:#2563eb;border-color:#2563eb}.navbtn.check:hover:not(:disabled){background:#1d4fd0}
.counter{font-weight:800;color:var(--navy);white-space:nowrap}
.stats{display:flex;align-items:center;gap:12px 18px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.stat{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff;font-size:12.2px;font-weight:700;white-space:nowrap}
.stat b{font-size:16px;color:var(--navy)}
.statgroup{display:flex;gap:10px;flex:1}
.score{font-size:13.8px;color:var(--muted);font-weight:700;white-space:nowrap}.score b{color:var(--navy);font-size:16.8px}
.timer{color:var(--navy);font-weight:800;font-size:17.6px;white-space:nowrap}
.hint{margin:8px 0 0;color:var(--muted);font-size:13px;text-align:center}
/* results */
.hero{text-align:center}
.kicker{margin:0;color:var(--blue);font-weight:800;letter-spacing:.12em;font-size:13px}
.badge{width:136px;height:136px;margin:8px auto 12px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#4bb7ff,#0b4d92);border:8px solid #d7efff;box-shadow:0 12px 28px rgba(7,59,119,.25);color:#fff;font-size:30px;font-weight:800}
.badge small{display:block;font-size:15px;font-weight:700;opacity:.85;text-align:center}
.slotwin{position:relative;display:inline-block;min-width:270px;height:62px;overflow:hidden;border-radius:16px;background:#0f2f57;border:4px solid #f6c94c;box-shadow:inset 0 8px 14px rgba(0,0,0,.35),0 8px 18px rgba(7,59,119,.2)}
.slotwin:before,.slotwin:after{content:"";position:absolute;left:0;right:0;height:14px;z-index:2;pointer-events:none}
.slotwin:before{top:0;background:linear-gradient(#0f2f57,transparent)}.slotwin:after{bottom:0;background:linear-gradient(transparent,#0f2f57)}
.reel{display:block;color:#fff;font-size:30px;font-weight:800;line-height:54px;padding:0 18px;white-space:nowrap}
.reel.tick{animation:roll .09s linear}
@keyframes roll{from{transform:translateY(-60%);opacity:.4}to{transform:translateY(0);opacity:1}}
.reel.land{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:translateY(-40%) scale(.8)}100%{transform:none}}
.slotwin.done.r0{border-color:var(--bad)}.slotwin.done.rhi{border-color:#31c46c;box-shadow:0 0 0 6px rgba(49,196,108,.18),0 8px 18px rgba(7,59,119,.2)}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.sum{padding:12px;border-radius:15px;background:#f5f9fd;border:1px solid #dbe8f2;text-align:center}
.sum span{display:block;color:var(--muted);font-size:12px;font-weight:700}.sum b{font-size:18px;color:var(--navy)}
.breakdown{margin-top:14px;padding:10px 16px;border-radius:17px;background:#f8fbfe;border:1px solid var(--line)}
.brow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #e3ebf2;font-size:14.5px;font-weight:600}.brow:last-child{border:0}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.abtn{border:0;border-radius:12px;padding:11px 18px;min-height:44px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}
.abtn.sec{background:#e7eef5;color:#264861}
.rgroup{margin-bottom:18px}
.rgroup h3{margin:0;padding:10px 14px;background:var(--navy);color:#fff;border-radius:12px 12px 0 0;font-size:15px}
.ritem{padding:12px 15px;background:#fff;border:1px solid var(--line);border-top:0;font-size:14.5px;line-height:1.5}
.ritem:last-child{border-radius:0 0 12px 12px}
.ritem p{margin:3px 0}
.good{color:#11743b;font-weight:800}.badt{color:#bd3333;font-weight:800}
.rq{font-weight:700;color:var(--ink)}
#confetti{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:40}
.cf{position:absolute;top:-20px;width:9px;height:14px;animation:fall 3.8s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(760deg);opacity:0}}
.fatal{padding:18px;border-radius:14px;background:#fff1f1;border:2px solid var(--bad);color:var(--badink);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:600px) and (max-width:1023px){.hdr img{height:80px}}
@media (max-width:640px){
  .hdr{padding:8px 12px}.hdr img{height:45px}
  .t1{font-size:16px}.t2{font-size:12px}.t3{font-size:10px}
  .bar{font-size:11.5px;padding:6px 10px;min-height:32px;gap:6px}
  #app{margin-top:16px;padding:0 12px}
  .instr{padding:14px 18px;font-size:16px;letter-spacing:.56px;border-radius:18px}
  .pill{margin-top:10px;font-size:11.5px;padding:5px 10px}
  .taskbox{padding:12px 14px;font-size:16px;line-height:27.2px;margin:10px 0}
  .choices{gap:9px}
  .choice{padding:12px 10px;min-height:62px;font-size:13.28px;line-height:19.92px}
  .choice.correct,.choice.wrong{padding-right:28px}.choice .mk{right:8px;font-size:16px}
  .feedback{margin-top:10px;padding:10px 12px;font-size:14px;line-height:1.5}
  .bank{gap:6px;padding:8px;margin-top:10px;min-height:56px}
  .chip{padding:6px 10px;font-size:14.5px;min-height:40px}
  .board{padding:2px 10px;font-size:14.5px;line-height:1.5;margin-top:10px}
  .srow{padding:5px 0;gap:6px}
  .gap{min-width:104px;min-height:32px;font-size:14px;padding:1px 8px}
  .fix{font-size:13px;padding:0 6px}
  .why{font-size:12px;line-height:1.35}
  .mrow{grid-template-columns:minmax(0,1fr) 124px;gap:8px;padding:4px 0}
  .mrow .gap{font-size:13px}
  .hint{margin-top:6px;font-size:12px}
  .mdef{font-size:12.5px;line-height:1.35;gap:5px}
  .nav{gap:7px;margin-top:6px;padding:6px 0}
  .navbtn{min-width:104px;padding:9px 10px;font-size:14px}
  .counter{font-size:13px}
  .stats{gap:6px;margin-top:10px;padding-top:10px;text-align:center}
  .statgroup{gap:4px}
  .stat{flex:1;display:block;padding:6px 3px;font-size:10px}.stat b{display:block;font-size:13.8px}
  .score{font-size:10.5px}.score b{display:block;font-size:13px}
  .timer{font-size:12.8px}
  .badge{width:112px;height:112px;font-size:22px;margin:6px auto 10px;border-width:6px}.badge small{font-size:12px}
  .slotwin{min-width:230px;height:54px}.reel{font-size:24px;line-height:46px}
  .sumgrid{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .sum{padding:7px 4px}.sum span{font-size:10px;line-height:1.25}.sum b{font-size:14px}
  .breakdown{padding:4px 12px;margin-top:10px}
  .brow{font-size:12.5px;padding:6px 0}
  .actions{margin-top:12px;gap:8px;flex-wrap:nowrap}.abtn{padding:10px 12px;font-size:14px}
}
</style>
</head>
<body>
<div class="sheet">
  <header class="hdr">
    <img class="header-teacher-img" src="teacher.png" alt="Teacher Soufiane">
    <div class="htitle"><div class="t1">English2BAC Quizzes</div><div class="t2">Learn • Practice • Succeed</div><div class="t3">with Teacher.Soufiane</div></div>
    <img class="header-logo-img" src="logo.png" alt="Level-UP 2BAC">
  </header>
  <div class="bar"><span>UNIT6: VOCABULARY</span><span>CULTURAL ISSUES &amp; VALUES</span><span>QUIZ-2</span></div>
</div>
<main id="app" aria-live="polite"></main>
<div id="confetti" aria-hidden="true"></div>
<p id="liveMsg" class="sr" aria-live="assertive"></p>
<style>
/* Shared vocabulary-engine additions: typed word-family chart, typed word-form sentences, two-line MCQ question */
.wf{width:100%;border-collapse:separate;border-spacing:0;font-size:16px}
.wf th{background:#e6f2ff;color:var(--navy);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;text-align:center}
.wf th:first-child{border-radius:10px 0 0 10px}.wf th:last-child{border-radius:0 10px 10px 0}
.wf td{padding:4px 5px;text-align:center;border-bottom:1px solid #e3ebf2;font-weight:600;color:var(--ink);vertical-align:middle}
.wf tr:last-child td{border-bottom:0}
.wf td.dash{color:#94a3b8}
.tin{width:100%;min-width:0;height:38px;border:2px dashed #8fb5da;border-radius:10px;background:#fff;padding:2px 8px;font:700 15px Poppins,Arial,sans-serif;color:#075796;text-align:center}
.tin:focus{outline:none;border-style:solid;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.tans{display:inline-block;min-width:80%;padding:4px 8px;border-radius:10px;border:2px solid;font-weight:700;line-height:1.25}
.tans.correct{border-color:var(--ok);background:var(--okbg);color:var(--okink)}
.tans.wrong{border-color:var(--bad);background:var(--badbg);color:var(--badink)}
.tans.wrong .w{text-decoration:line-through}
.tfix{display:block;margin-top:2px;color:var(--okink);font-weight:800;font-size:14px}
.cue{color:var(--blue);font-weight:800;white-space:nowrap}
.tin.inl{display:inline-block;width:190px;vertical-align:middle;margin:1px 2px}
.taskbox .tans{min-width:0}
.mq{display:block;font-size:15px;line-height:1.45;font-weight:700;color:var(--blue);margin-bottom:4px}
.mgap{display:inline-block;min-width:90px;border-bottom:3px solid var(--navy);margin:0 3px;vertical-align:baseline;height:1em}
.kbd{font-size:12px;color:var(--muted)}
.taskbox:has(.mq){line-height:30px;padding-top:10px;padding-bottom:10px}
/* story gaps that are not the current question */
.ogap{display:inline-block;min-width:44px;padding:0 6px;border-bottom:2px dotted #8fb5da;color:#94a3b8;font-size:.8em;font-weight:700;text-align:center;line-height:1.3}
/* 6-pair matching: two columns on a laptop; marked chart cells kept short */
@media (min-width:641px){.board.two{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}.board.two .mrow{grid-template-columns:minmax(0,1fr) 170px}.board.two .mrow:nth-last-child(2){border-bottom:0}}
.wf .tans{padding:2px 6px;line-height:1.2;font-size:14px}.wf .tfix{font-size:13px;line-height:1.2}
@media (max-width:640px){.wf .tans{font-size:12px;padding:1px 4px}.wf .tfix{font-size:11.5px}}
/* progress bar above the navigation */
.prog{height:6px;margin:12px 0 0;border-radius:6px;background:#e3ebf2;overflow:hidden}.prog i{display:block;height:100%;background:#26a85b;border-radius:6px;transition:width .3s}
@media (max-width:640px){.prog{margin-top:9px;height:5px}}
/* matching rows that hold a definition: smaller text */
.mrow .mdef span:last-child{line-height:1.35}
/* results: time taken, attempts, best score */
.sumline{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.sumline b{color:var(--navy);font-size:15px}
@media (max-width:640px){.sumline{font-size:12px;gap:4px 12px;margin-top:8px}.sumline b{font-size:13px}}
/* two gaps per screen: small gap number, compact feedback lines */
.gn{display:inline-block;margin:0 2px 0 4px;color:var(--blue);font-size:.7em;font-weight:800;vertical-align:super;line-height:1}
.feedback.fb2{margin-top:6px;padding:6px 12px;font-size:14px;line-height:1.4}
@media (max-width:640px){.feedback.fb2{font-size:12.5px;padding:5px 9px;margin-top:5px}}
/* sorting game: a word bank and two category boxes */
.sortnote{margin:8px 0 0;padding:6px 12px;border-radius:12px;background:#f5f9fd;border:1px solid #d7e7f4;font-size:13.5px;line-height:1.45;color:#334155}
.sortnote b{color:var(--navy)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cat{min-height:84px;border:2px dashed #8fb5da;border-radius:16px;background:#fff;padding:6px 8px;cursor:pointer;transition:background .15s,border-color .15s}
.cat h4{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;text-align:center}
.cat .in{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.cat.ready{border-style:solid;border-color:#2563eb;background:#f2f8ff}
.cat.over{background:#fff6d1;border-color:#e0a800}
.cat:focus-visible{outline:3px solid #f9c74f;outline-offset:2px}
.sc{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;border:2px solid var(--ok);background:var(--okbg);color:var(--okink);font-size:13.5px;font-weight:700;line-height:1.25}
.sc.late{border-color:var(--bad);background:#fff;color:var(--badink)}
.chip.selc{border-color:#2563eb;background:#d9efff;color:#075796;box-shadow:0 0 0 3px #f9c74f}
.chip.shake{border-color:var(--bad);background:var(--badbg);color:var(--badink);animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
