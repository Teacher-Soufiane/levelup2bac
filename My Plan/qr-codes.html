<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Codes for the Books</title>
<style>
:root{--navy:#123d70;--blue:#147fc9;--bg:#edf4fa;--line:#d6e3f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#10243e}
.tools{max-width:1000px;margin:0 auto;padding:16px}
.tools h1{color:var(--navy);font-size:22px;margin:0 0 8px}
.tools p{margin:4px 0 10px;color:#5b6b80;font-size:14px}
.tools input{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font:inherit}
.tools .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.tools button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
.sheet{max-width:1000px;margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;break-inside:avoid}
.qr b{display:block;color:var(--navy);font-size:17px}
.qr span{display:block;font-size:13px;color:#5b6b80;margin-bottom:8px}
.qr .code{display:flex;justify-content:center;margin:6px 0}
.qr small{display:block;font-size:10px;color:#8a97a8;word-break:break-all}
@media print{.tools{display:none}body{background:#fff}.sheet{grid-template-columns:repeat(3,1fr)}.qr{border:1px solid #bbb}}
</style>
</head>
<body>
<div class="tools">
  <h1>QR codes for the books</h1>
  <p>Paste the address of the <b>My Plan</b> page once it is online, then press Make the codes and print (Ctrl+P). Each unit's code opens that unit's quizzes; the others open the plan, the level test and the writing coach.</p>
  <input id="base" value="https://teacher-soufiane.github.io/levelup/My%20Plan/" aria-label="My Plan page address">
  <div class="row"><button id="go" type="button">Make the codes</button><button type="button" onclick="window.print()">Print</button></div>
</div>
<div class="sheet" id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var TOPIC = ['', 'The Gifts of Youth', 'Humour', 'Education', 'Sustainable Development', 'Women and Power', 'Cultural Issues and Values', 'Citizenship', 'International Organizations', 'Science and Technology', 'Brain Drain'];
function make() {
  var base = document.getElementById('base').value.trim(), sheet = document.getElementById('sheet');
  var list = [['My weekly plan', 'Plan, progress and level test', ''], ['Level test', '20 questions, 10 minutes', '?tab=test'], ['Writing coach', 'Check your writing with the Bac grid', '?tab=writing']];
  for (var u = 1; u <= 10; u++) list.push(['Unit ' + u, TOPIC[u], '?unit=' + u]);
  sheet.innerHTML = '';
  list.forEach(function (it) {
    var url = base + it[2], d = document.createElement('div');
    d.className = 'qr';
    d.innerHTML = '<b></b><span></span><div class="code"></div><small></small>';
    d.querySelector('b').textContent = it[0]; d.querySelector('span').textContent = it[1]; d.querySelector('small').textContent = url;
    sheet.appendChild(d);
    if (window.QRCode) new QRCode(d.querySelector('.code'), { text: url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
    else d.querySelector('.code').textContent = 'QR library did not load: check the internet connection.';
  });
}
document.getElementById('go').onclick = make;
make();
</script>
</body>
</html>
