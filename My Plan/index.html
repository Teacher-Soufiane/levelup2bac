<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Plan · Level UP 2BAC</title>
<style>
:root{--bg:#edf4fa;--navy:#123d70;--blue1:#0c4f96;--blue2:#147fc9;--ink:#10243e;--muted:#5b6b80;--card:#fff;--line:#d6e3f0;
--ok:#1f9d55;--okbg:#e6f6ec;--mid:#d97706;--midbg:#fff4e0;--bad:#d64545;--badbg:#fdecec;--none:#eef2f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;min-height:100dvh}
button{font:inherit;cursor:pointer}
.head{position:sticky;top:0;z-index:5;background:#eaf4ff}
.head .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px}
.head img{width:56px;height:56px;object-fit:contain}
.head .in{padding:6px 16px}
main{transform-origin:top center}
.head .tt{text-align:center;flex:1}
.head .tt b{display:block;font-size:22px;color:var(--navy);letter-spacing:.5px}
.head .tt span{display:block;font-size:14px;color:var(--muted)}
.bar{background:var(--navy);color:#fff;text-transform:uppercase;font-size:13px;font-weight:700;letter-spacing:.6px;text-align:center;padding:7px 12px}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:16px 16px 96px}
.card-ins{background:linear-gradient(135deg,var(--blue1),var(--blue2));color:#fff;border-radius:20px;padding:14px 18px;font-weight:800;text-transform:uppercase;font-size:18px;text-align:center;margin-bottom:14px}
.pill{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:0 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.q{font-size:19px;font-weight:600;text-align:center;margin:10px 0 16px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:700;font-size:16px;color:var(--ink);text-align:center}
.opt:hover{border-color:var(--blue2)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.btn{background:var(--blue2);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px}
.btn.navy{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px}
.nav .btn{width:100%}
.units{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.units button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 0;font-size:18px;font-weight:800;color:var(--navy);white-space:nowrap}
.units button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.big{font-size:44px;font-weight:900;color:var(--navy);text-align:center}
.big small{font-size:20px;color:var(--muted)}
.sk{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-weight:700}
.meter{height:12px;background:var(--none);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.tasks{display:grid;grid-template-columns:1fr;column-gap:10px}
@media (min-width:760px){.tasks.two{grid-template-columns:1fr 1fr}}
.tasks.two .task{padding:7px 10px;margin-bottom:6px}
.tasks.two .task .ic{width:28px;height:28px;flex-basis:28px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.task .ic{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--none);color:var(--muted)}
.task.done .ic{background:var(--ok);color:#fff}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:15px}
.task .tx span{display:block;font-size:13px;color:var(--muted)}
.task .why{color:var(--mid);font-weight:700}
.grid{width:100%;border-collapse:separate;border-spacing:4px}
.grid th{font-size:12px;color:var(--muted);font-weight:800}
.grid td{text-align:center;border-radius:8px;padding:5px 0;font-weight:800;font-size:13px;background:var(--none);color:var(--muted)}
.grid td.u{background:var(--navy);color:#fff;cursor:pointer}
.c-ok{background:var(--okbg)!important;color:var(--ok)!important}
.c-mid{background:var(--midbg)!important;color:var(--mid)!important}
.c-bad{background:var(--badbg)!important;color:var(--bad)!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.yn{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.yn:first-of-type{border-top:0}
.yn p{flex:1;margin:0;font-weight:600;font-size:15px}
.yn .hint{display:block;font-weight:500;font-size:13px;color:var(--mid);margin-top:3px}
.yn button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:800}
.yn button.y.on{background:var(--ok);border-color:var(--ok);color:#fff}
.yn button.n.on{background:var(--bad);border-color:var(--bad);color:#fff}
textarea{width:100%;min-height:84px;height:84px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;resize:vertical}
.bands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bands button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:800;font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.dock .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.dock button{background:none;border:0;padding:9px 0 8px;font-weight:800;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.dock button i{font-style:normal;font-size:20px}
.dock button.on{color:var(--navy)}
.dock button.on i{transform:scale(1.12)}
.frame{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column}
.frame .fb{background:var(--navy);display:flex;align-items:center;gap:10px;padding:6px 10px}
.frame .fb button{background:#fff;color:var(--navy);border:0;border-radius:10px;padding:7px 12px;font-weight:800}
.frame .fb span{color:#fff;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame iframe{flex:1;border:0;width:100%}
.tip{border-left:4px solid var(--mid);background:var(--midbg);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:14px}
h3{margin:4px 0 10px;color:var(--navy)}
.back{background:none;border:0;color:var(--navy);font-weight:800;font-size:15px;padding:2px 0;margin:0 0 8px;text-decoration:underline;text-underline-offset:3px}
.step{margin:0 0 8px;font-weight:800;color:var(--navy);font-size:15px;text-align:center}
.step.miss{color:var(--bad)}
.warn{background:var(--badbg);color:var(--bad);border-radius:10px;padding:8px 12px;font-weight:700;text-align:center;margin:0 0 10px}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.tcard b{display:block;color:var(--navy);font-size:17px}
.tcard span{display:block;font-size:13px;color:var(--muted);margin:4px 0 8px}
.tcard.done{border-color:var(--ok)}
@media (max-width:600px){
 .head img{width:44px;height:44px}.head .tt b{font-size:16px}.head .tt span{font-size:11px}
 .bar{font-size:11.5px}
 main{padding:12px 12px 90px}
 .card-ins{font-size:15px;padding:12px 14px;border-radius:16px}
 .q{font-size:17px}
 .opt{font-size:15px;padding:12px 8px}
 .sk{grid-template-columns:90px 1fr 44px;font-size:14px}
 .grid td{padding:6px 0;font-size:12px}
 textarea{height:70px;min-height:70px}
 .units button{font-size:14px;padding:12px 0;border-radius:12px}
 .units{gap:6px}
 .chip{padding:6px 10px;font-size:14px}.chips{gap:6px}.step{margin-bottom:6px}
}
</style>

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('button,td[data-unit-open]'); if (!b || b.disabled) return;
  var d = b.dataset, C = view.coach;
  if (d.tab) { view = { tab: d.tab }; return render(); }
  if (d.unit) { S.unit = +d.unit; save(); if (S.plans.length) S.plans.pop(); save(); view = { tab: 'plan' }; return render(); }
  if (d.open) return openQuiz(d.open);
  if (d.unitOpen) { view = { tab: 'progress', unit: +d.unitOpen }; return render(); }
  if (d.band) { var id = view.ask; S.manual[id] = { pct: +d.band, t: Date.now() }; save(); view = view.back || { tab: 'plan' }; view.ask = null; return render(); }
  /* a stopped test continues where it was; any other test starts fresh */
  if (d.test) { if (!(S.test && S.test.id === +d.test)) S.test = dealTest(+d.test); save(); view = { tab: 'test', play: true }; return render(); }
  if (d.pick !== undefined) { var T = S.test, k = T.order[T.i]; if (T.ans[k] === undefined) { T.ans[k] = +d.pick; save(); renderTest(); } return; }
  if (d.task) { C.task = +d.task; return renderCoach(); }
  if (d.type) { C.text = (document.getElementById('ctext') || {}).value || C.text; C.type = d.type; return renderCoach(); }
  if (d.yn) { C.yn[d.yn] = +d.v; return renderCoach(); }
  switch (d.act) {
    case 'starttest': view = { tab: 'test' }; return render();
    case 'skiptest': S.tskip = true; save(); view = { tab: 'plan' }; return render();
    case 'tmenu': view = { tab: 'test' }; return render();
    case 'tprev': if (S.test.i > 0) { S.test.i--; save(); } return renderTest();
    case 'tnext':
      if (S.test.i < 19) { S.test.i++; save(); return renderTest(); }
      var T = S.test, L = TESTS[T.id - 1], sc = L.filter(function (t, i) { return T.ans[i] === t.a; }).length, old = S.tests[T.id];
      S.tests[T.id] = { ans: T.ans, last: sc, best: Math.max(sc, old ? old.best : 0), tries: (old ? old.tries : 0) + 1, date: Date.now() };
      S.test = null;
      if (S.plans.length && Date.now() - S.plans[S.plans.length - 1].start < 7 * DAY) S.plans.pop();
      save(); view = { tab: 'test', tres: T.id }; return render();
    case 'toplan': view = { tab: 'plan' }; return render();
    case 'newplan': makePlan(); return render();
    case 'chunit': view = { tab: 'plan', chunit: true }; return render();
    case 'unitback': view = { tab: 'plan' }; return render();
    case 'tleave': view = { tab: 'test' }; return render();
    case 'allunits': view = { tab: 'progress' }; return render();
    case 'notyet': view = view.back || { tab: 'plan' }; view.ask = null; return render();
    case 'cgo': C.text = (document.getElementById('ctext') || {}).value || ''; if (!C.task || !C.type) { C.warn = true; return renderCoach(); } C.warn = false; C.step = 1; return renderCoach();
    case 'cprev': C.step = Math.max(0, C.step - 1); return renderCoach();
    case 'cnext': C.step++; return renderCoach();
    case 'cnew': view.coach = null; return renderCoach();
    case 'cfix': C.step = 1; C.saved = false; S.coach.pop(); save(); return renderCoach();
  }
});
document.addEventListener('input', function (ev) { if (ev.target.id === 'ctext' && view.coach) view.coach.text = ev.target.value; });

/* ?unit=N opens that unit's quizzes (for the QR codes in the book); ?tab=writing|test|progress opens a section */
var mU = /[?&]unit=(\d+)/.exec(location.search), mT = /[?&]tab=(\w+)/.exec(location.search);
if (mU && +mU[1] >= 1 && +mU[1] <= 10) view = { tab: 'progress', unit: +mU[1] };
else if (mT && ['plan', 'progress', 'test', 'writing'].indexOf(mT[1]) >= 0) view = { tab: mT[1] };
render();
})();
</script>
</body>
</html>
