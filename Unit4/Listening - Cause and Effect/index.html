.spk .waves{position:absolute;top:24px;display:flex;align-items:center;gap:2px;height:26px;opacity:0;transition:opacity .2s}
.spk-left .waves{right:-10px}.spk-right .waves{left:-10px}
.spk .waves i{display:block;width:3px;height:30%;border-radius:2px;background:#2563eb}
.spk.on .waves{opacity:1}
.spk.on .waves i{animation:spkBar .55s ease-in-out infinite alternate}
.spk.on .waves i:nth-child(2){animation-delay:.18s}.spk.on .waves i:nth-child(3){animation-delay:.36s}
@keyframes spkBar{from{height:25%}to{height:100%}}
@media (max-width:640px){
  .spk-stage{gap:6px}
  .spk{width:58px;gap:1px}
  .spk.on img{transform:scale(1.04)}
  .spk img{width:50px;height:50px;border-width:2px}
  .spk figcaption{font-size:11.5px}
  .spk .waves{top:14px;height:22px}
  .spk-left .waves{right:-6px}.spk-right .waves{left:-6px}
  .spk-mid button{min-width:0!important;padding-left:6px!important;padding-right:6px!important;white-space:nowrap!important;font-size:13px!important;min-height:40px!important;height:auto!important}
  .spk-mid [class*="controls"]{gap:5px!important;flex-wrap:nowrap!important}
}
@media (prefers-reduced-motion:reduce){.spk.on img,.spk.on .waves i{animation:none}}
</style>
<script>
/* SPEAKERS-2026-11-18: needs window.__SPKCFG = {panel, hide, people(), turns(), time(), playing()} set before this script. */
(function(){
  var C=window.__SPKCFG; if(!C) return;
  function fig(p,side,idx){
    var f=document.createElement('figure'); f.className='spk spk-'+side; f.dataset.who=String(idx);
    var im=document.createElement('img'); im.alt=p.name; im.src=p.img; im.onerror=function(){ f.style.visibility='hidden'; };
    var w=document.createElement('span'); w.className='waves'; w.setAttribute('aria-hidden','true'); w.innerHTML='<i></i><i></i><i></i>';
    var c=document.createElement('figcaption'); c.textContent=p.name;
    f.appendChild(im); f.appendChild(w); f.appendChild(c); return f;
  }
  function build(){
    var panel=document.querySelector(C.panel); if(!panel) return null;
    var st=panel.querySelector(':scope > .spk-stage'); if(st) return st;
    var ppl=C.people(); if(!ppl||ppl.length<2) return null;
    var hide=C.hide?panel.querySelector(C.hide):null; if(hide) hide.classList.add('spk-hidden');
    st=document.createElement('div'); st.className='spk-stage';
    var mid=document.createElement('div'); mid.className='spk-mid';
    [].slice.call(panel.children).forEach(function(ch){ if(ch===hide||ch.tagName==='AUDIO'||ch.tagName==='SCRIPT') return; mid.appendChild(ch); });
    st.appendChild(fig(ppl[0],'left',0)); st.appendChild(mid); st.appendChild(fig(ppl[1],'right',1));
    panel.appendChild(st); return st;
  }
  function who(t){ var T=C.turns()||[]; for(var i=0;i<T.length;i++){ var x=T[i]; if(t>=x[0]-0.15&&t<=x[1]+0.3) return x[2]; } return -1; }
  var last='';
  function paint(){
    var st=build(); if(!st) return;
    var w=-1; try{ if(C.playing()) w=who(C.time()||0); }catch(e){}
    var key=w+'|'+(st.dataset.k||(st.dataset.k=String(Math.random()))); if(key===last) return; last=key;
    st.classList.toggle('talking',w>=0);
    [].forEach.call(st.querySelectorAll('.spk'),function(f){ f.classList.toggle('on',String(w)===f.dataset.who); });
  }
  setInterval(paint,100); paint();
  window.__speakers={ who:who, paint:paint, build:build };
})();
</script>
