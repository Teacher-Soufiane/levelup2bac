(function () {

  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  window.__mixPlace = function (list, isAns, tag) {
    var n = list.length, ai = -1, i, min = Infinity, cand = [], last = null;
    for (i = 0; i < n; i++) if (ai < 0 && isAns(list[i])) ai = i;
    if (ai < 0 || n < 2) return shuf(list);
    var key = 'mixpos:' + location.pathname + ':' + (tag || hash(list.map(function (x) { return typeof x === 'object' ? (x.text || JSON.stringify(x)) : String(x); }).join('|')));
    var mm = memo[key], now = Date.now(), rest0;

    try { last = localStorage.getItem(key); } catch (e) {}
    /* the last two places are avoided: some pages build the order twice, and the one the student saw must still move */
    var hist = last ? String(last).split(',') : [], recent = hist.length ? hist[hist.length - 1] : null;

    for (i = 0; i < n; i++) if (!bad(i)) min = Math.min(min, count[i] || 0);
    for (i = 0; i < n; i++) if (!bad(i) && (count[i] || 0) === min) cand.push(i);
    if (!cand.length) for (i = 0; i < n; i++) if (String(i) !== recent && i !== prev) cand.push(i);
    if (!cand.length) for (i = 0; i < n; i++) if (String(i) !== recent) cand.push(i);
    if (!cand.length) cand = [0];
    var p = cand[Math.floor(Math.random() * cand.length)];

  function bindAudioControls(){

<script>
/* PHONEFIT-2026-11-18 (from Unit 10 Listening): a screen a little taller than the screen is shrunk a little so it fits.
   Never below 0.9, and only when that makes it fit completely. Body, header and info bar keep the full width. */
(function(){
  var app=document.getElementById('app'); if(!app) return;
  var busy=false;
  function fit(){
    if(busy) return; busy=true;
    var b=document.body, H=document.documentElement, bleed=document.querySelectorAll('[data-look~="hdr"],[data-look~="bar"]');
    function apply(z){
      b.style.zoom=z||''; b.style.width=z?(H.clientWidth/z)+'px':'';
      [].forEach.call(bleed,function(e){ if(e.__w0===undefined||e.style.width!==e.__wSet){ if(!parseFloat(e.style.width)) return; e.__w0=e.style.width; } e.style.setProperty('width',z?(parseFloat(e.__w0)/z)+'px':e.__w0,'important'); e.__wSet=e.style.width; });
    }
    var z0=parseFloat(document.body.style.zoom)||0;
    apply(0);
    var need=H.scrollHeight, have=window.innerHeight;
    if(need>have){ var z=Math.floor(have/need*1000)/1000, tries=[z,z-0.01,z-0.02,0.9], ok=false;
      for(var t=0;t<tries.length&&!ok;t++){ if(tries[t]<0.9) continue; apply(tries[t]); ok=H.scrollHeight<=have; }
      if(!ok) apply(0); else if(z0&&z0!==tries[t-1]&&Math.abs(tries[t-1]-z0)<=0.02){ var zk=tries[t-1]; apply(z0); if(H.scrollHeight>have) apply(zk); } } /* STEADY-2026-11-18: keep the zoom already in use when it still fits, so the header does not jitter */
    busy=false;
  }
  window.__u1fit=fit;
  new MutationObserver(function(){ setTimeout(fit,0); }).observe(app,{childList:true,subtree:true});
  window.addEventListener('resize',function(){ setTimeout(fit,50); });
  var mo=new MutationObserver(function(){ var again=false; [].forEach.call(document.querySelectorAll('[data-look~="hdr"],[data-look~="bar"]'),function(e){ if(e.__wSet!==undefined&&e.style.width!==e.__wSet) again=true; }); if(again) setTimeout(fit,0); });
  setTimeout(function(){ [].forEach.call(document.querySelectorAll('[data-look~="hdr"],[data-look~="bar"]'),function(e){ mo.observe(e,{attributes:true,attributeFilter:['style']}); }); fit(); },1200);
  fit();
})();
</script>

<style id="speakers-2026-11-18">
/* SPEAKERS-2026-11-18 (teacher): two portraits beside the player, the boy on the left and the girl on the right.
   The one who is speaking glows and shows sound bars; the other one is faded. During the intro nobody is highlighted. */
.spk-hidden{display:none!important}

<script>
/* SPEAKERS-2026-11-18: needs window.__SPKCFG = {panel, hide, people(), turns(), time(), playing()} set before this script. */
(function(){
  var C=window.__SPKCFG; if(!C) return;
  function fig(p,side,idx){
    var f=document.createElement('figure'); f.className='spk spk-'+side; f.dataset.who=String(idx);
    var im=document.createElement('img'); im.alt=p.name; im.src=p.img; im.onerror=function(){ f.style.visibility='hidden'; };
    var w=document.createElement('span'); w.className='waves'; w.setAttribute('aria-hidden','true'); w.innerHTML='<i></i><i></i><i></i>';
    var c=document.createElement('figcaption'); c.textContent=p.name;
    f.appendChild(im); f.appendChild(w); f.appendChild(c); return f;
  }
  function build(){
    var panel=document.querySelector(C.panel); if(!panel) return null;
    var st=panel.querySelector(':scope > .spk-stage'); if(st) return st;
    var ppl=C.people(); if(!ppl||ppl.length<2) return null;
    var hide=C.hide?panel.querySelector(C.hide):null; if(hide) hide.classList.add('spk-hidden');
    st=document.createElement('div'); st.className='spk-stage';
    var mid=document.createElement('div'); mid.className='spk-mid';
    [].slice.call(panel.children).forEach(function(ch){ if(ch===hide||ch.tagName==='AUDIO'||ch.tagName==='SCRIPT') return; mid.appendChild(ch); });
    st.appendChild(fig(ppl[0],'left',0)); st.appendChild(mid); st.appendChild(fig(ppl[1],'right',1));
    panel.appendChild(st); return st;
  }
  function who(t){ var T=C.turns()||[]; for(var i=0;i<T.length;i++){ var x=T[i]; if(t>=x[0]-0.15&&t<=x[1]+0.3) return x[2]; } return -1; }
  var last='';
  function paint(){
    var st=build(); if(!st) return;
    var w=-1; try{ if(C.playing()) w=who(C.time()||0); }catch(e){}
    var key=w+'|'+(st.dataset.k||(st.dataset.k=String(Math.random()))); if(key===last) return; last=key;
    st.classList.toggle('talking',w>=0);
    [].forEach.call(st.querySelectorAll('.spk'),function(f){ f.classList.toggle('on',String(w)===f.dataset.who); });
  }
  setInterval(paint,100); paint();
  window.__speakers={ who:who, paint:paint, build:build };
})();
</script>
